version: "3.8"

services:
  mongodb:
    image: mongo:6.0
    container_name: hrone_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=attendance_db
    volumes:
      - mongo_data:/data/db

  api:
    image: python:3.12-slim
    container_name: hrone_api
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=attendance_db
    volumes:
      - .:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - mongodb

volumes:
  mongo_data:
